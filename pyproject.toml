[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-legacy-rpc"
version = "0.0.4"
description = "Reverse-engineered wire format and implementation of Unity's legacy RPC networking (NetworkView / [RPC] / OnSerializeNetworkView)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["pytest", "ruff~=0.14"]

[project.urls]
Repository = "https://github.com/Rose-Vibe/open-legacy-rpc"
Documentation = "https://github.com/Rose-Vibe/open-legacy-rpc/tree/main/docs"

[tool.setuptools.packages.find]
include = ["protocol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["experiments/", "UnityProject/", "scripts/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["protocol", "tools"]
